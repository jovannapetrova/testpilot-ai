services:
  - type: web
    name: testpilot-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: testpilot-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: ENABLE_TEST_EXECUTION
        value: "false"
      - key: PASSWORD_RESET_CODE_MINUTES
        value: "30"
      - key: PASSWORD_RESET_RESEND_SECONDS
        value: "60"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: MAX_EXTRACTED_SIZE_MB
        value: "150"
      - key: MAX_ARCHIVE_FILES
        value: "5000"

databases:
  - name: testpilot-ai-db
    plan: free
